name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run full test suite
        env:
          PYTHONPATH: "."
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short

      - name: Create release archive
        run: |
          git archive --format=tar.gz \
            --prefix=math-mcp-server/ \
            -o math-mcp-server-${{ github.ref_name }}.tar.gz \
            HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: math-mcp-server-${{ github.ref_name }}.tar.gz
          body: |
            ## What's included
            - 8 read-only math tools: `calculate`, `convert_units`, `solve`, `simplify`, `diff`, `integrate`, `describe`, `eval_latex`
            - AST-validated expression evaluator — no `eval()` or `exec()`
            - 6-stage LaTeX formula pipeline (parse → validate → resolve → substitute → evaluate → format)
            - Cross-platform timeout (`signal.alarm` on Unix, `threading.Timer` on Windows)
            - Constrained mode via `MCP_CONSTRAINED_MODE=1`
            - 74 tests passing on Ubuntu, macOS, and Windows

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for install instructions and `mcp.json` config.
