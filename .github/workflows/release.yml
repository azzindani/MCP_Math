name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Also build and push the GHCR container image"
        type: boolean
        default: false

jobs:
  # Publishes ghcr.io/<owner>/math-mcp-server:<version> + :latest from the
  # existing Dockerfile. Independent of the `release` job so a registry
  # permission hiccup never blocks the GitHub Release.
  # First run may need repo Settings -> Actions -> "Read and write permissions".
  #
  # Opt-in, not automatic. A tag push cuts the GitHub Release only; the fleet
  # is deployed from locally built images, so publishing a package on every
  # tag spends CI minutes on an artefact nothing pulls. To publish one, run
  # this workflow by hand against the tag with publish_image=true. `inputs`
  # is null on a push event, so the condition is false there without a
  # second clause.
  docker:
    name: Publish Docker image (GHCR)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: ./.github/actions/docker-ghcr-publish
        with:
          image-name: math-mcp-server
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Full history: the notes step diffs against the previous tag, and a
      # depth-1 checkout has neither the tags nor the commits for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      - name: Run full test suite
        env:
          PYTHONPATH: "."
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short

      # No archive is built here. GitHub attaches its own source zip/tar.gz to
      # every release from the tag, so a hand-rolled `git archive` of the same
      # commit only adds a third copy to download.
      # The body used to be a fixed block written inline here, so every release
      # said the same thing and none of them said what had changed in it. It
      # also carried a hardcoded tool count, which is the drift that made four
      # READMEs wrong at once -- the tools are listed instead, which cannot go
      # stale by one.
      - name: Build release notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            LOG=$(git log --oneline --no-decorate | head -50)
          else
            LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD" | head -50)
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$LOG" | sed 's/^/- /'
            echo ""
            echo "## What's included"
            echo ""
            echo "- Read-only math tools: \`calculate\`, \`convert_units\`, \`solve\`, \`simplify\`, \`diff\`, \`integrate\`, \`describe\`, \`eval_latex\`"
            echo "- AST-validated expression evaluator — no \`eval()\` or \`exec()\`"
            echo "- 6-stage LaTeX formula pipeline (parse → validate → resolve → substitute → evaluate → format)"
            echo "- Cross-platform timeout (\`signal.alarm\` on Unix, \`threading.Timer\` on Windows)"
            echo "- Constrained mode via \`MCP_CONSTRAINED_MODE=1\`"
            echo "- Tests run on Ubuntu, macOS, and Windows"
            echo "- HTTP transport (\`--transport http\`) with \`/health\`, \`/version\`, and bearer-token auth"
            echo ""
            echo "Install from source — see [README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md) for \`mcp.json\` config and Docker/HTTP deployment. No container image is published for this release."
          } > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: /tmp/release_notes.md
