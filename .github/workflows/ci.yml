name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "src"
      MCP_CONSTRAINED_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      - name: Verify tool docstrings (<= 80 chars)
        uses: ./.github/actions/verify-docstrings

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Run tests (constrained mode)
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests (normal mode)
        env:
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short

  # The suite above never starts a server (STANDARDS.md keeps pytest offline).
  # This job is the only thing that proves the thing we actually ship answers a
  # request -- and it builds that thing on the way in, `docker compose up
  # --build` from the same context and Dockerfile a release would use.
  #
  # That is why there is no separate build-only job any more. One existed, and
  # it could not fail in any case where this job does not fail first; all it
  # added was a second full image build on every push.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: ./.github/actions/e2e-smoke
        with:
          port: "8765"
          key-env: MATH_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves that and keeps
          # the real domain out of one more file.
          public-host: math.example.com
          mcp-path: /mcp
