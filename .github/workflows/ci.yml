name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "src"
      MCP_CONSTRAINED_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      - name: Verify tool docstrings (<= 80 chars)
        uses: ./.github/actions/verify-docstrings

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Run tests (constrained mode)
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests (normal mode)
        env:
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: ./.github/actions/docker-ghcr-publish
        with:
          image-name: math-mcp-server
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
