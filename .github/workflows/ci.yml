name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "src"
      MCP_CONSTRAINED_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Verify tool docstrings (<= 80 chars)
        run: uv run python tests/verify_tool_docstrings.py

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Run tests (constrained mode)
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests (normal mode)
        env:
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short
