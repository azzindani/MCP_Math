name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "src"
      MCP_CONSTRAINED_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      - name: Verify tool docstrings (<= 80 chars)
        uses: ./.github/actions/verify-docstrings

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Run tests (constrained mode)
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests (normal mode)
        env:
          MCP_CONSTRAINED_MODE: "0"
        run: uv run pytest tests/ -v --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: ./.github/actions/docker-ghcr-publish
        with:
          image-name: math-mcp-server
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The suite above never starts a server (STANDARDS.md keeps pytest offline),
  # and docker-build never runs the image it builds. This job is the only thing
  # that proves the thing we actually ship answers a request.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: ./.github/actions/e2e-smoke
        with:
          port: "8765"
          key-env: MATH_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves that and keeps
          # the real domain out of one more file.
          public-host: math.example.com
          mcp-path: /mcp
