name: "End-to-end smoke test (containerised)"
description: >
  Start this repo's container with docker compose, wait for /health, then run
  its remote_smoke_test.sh against localhost. Hermetic on purpose: a throwaway
  key is generated per run, nothing is read from Actions secrets, and no
  traffic reaches the deployed endpoint. Shared across all azzindani MCP_*
  repos so the job is defined in exactly one place.
  Called via: uses: azzindani/MCP_Math/.github/actions/e2e-smoke@main

  This covers the layer pytest deliberately cannot reach (STANDARDS.md keeps
  the suite offline): that the server actually starts, binds, speaks Streamable
  HTTP, rejects an unauthenticated call, and answers a real tools/call. The
  regression that motivated it -- DNS-rebinding Host validation returning
  421 on every tool call behind the reverse proxy -- passed both /health and
  the container healthcheck, so only a real request through a real header
  finds it.

inputs:
  port:
    description: Host port the compose service publishes.
    required: true
  key-env:
    description: Name of the API key variable this server reads (e.g. MATH_API_KEY).
    required: true
  public-host:
    description: >
      Public hostname to send as a Host header. Empty disables the check.
      This is what catches DNS-rebinding rejection without deploying anything.
    required: false
    default: ""
  mcp-path:
    description: Path of one MCP endpoint, for the Host-header probe.
    required: false
    default: "/mcp"
  health-timeout:
    description: Seconds to wait for /health before failing.
    required: false
    default: "120"
  create-dirs:
    description: >
      Space-separated gitignored directories this repo's compose bind-mounts.
      Created and chowned to the container user before startup.
    required: false
    default: "oauth-state"
  create-files:
    description: >
      Space-separated gitignored *files* this repo's compose bind-mounts. Docker
      creates a directory in place of a missing file mount, which the server
      then fails on at call time while /health still passes.
    required: false
    default: ""
  shared-dir:
    description: >
      Host directory to publish as MCP_OUTPUT_DIR. Set it for the repos whose
      smoke test checks the file exchange; empty skips that setup.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create the mounts compose expects
      shell: bash
      run: |
        # These paths are all gitignored, so a fresh checkout does not have
        # them. Docker then creates a *directory* wherever a file mount was
        # meant to be, and the server starts and answers /health while every
        # tool that touches the path fails -- which is exactly how
        # "[Errno 21] Is a directory: '/app/krawl.db'" reached CI.
        if [ -f tokens.example.json ] && [ ! -e tokens.json ]; then
          cp tokens.example.json tokens.json
        fi
        for d in ${{ inputs.create-dirs }}; do
          mkdir -p "$d"
        done
        for f in ${{ inputs.create-files }}; do
          [ -e "$f" ] || : > "$f"
        done
        if [ -n "${{ inputs.shared-dir }}" ]; then
          mkdir -p "${{ inputs.shared-dir }}"
          # The container runs unprivileged; a root-owned bind mount makes every
          # write fail EACCES, and the tool reports no output path at all.
          echo "MCP_SHARED_DIR=$PWD/${{ inputs.shared-dir }}" >> "$GITHUB_ENV"
          # Without a base URL the exchange returns no public_url, and the smoke
          # test's exchange assertions have nothing to check.
          echo "MCP_PUBLIC_BASE_URL=http://localhost:${{ inputs.port }}/files" >> "$GITHUB_ENV"
        fi
        sudo chown -R 999:999 ${{ inputs.create-dirs }} ${{ inputs.create-files }} ${{ inputs.shared-dir }} 2>/dev/null || true

    - name: Generate a throwaway API key
      shell: bash
      run: |
        # Per-run and thrown away with the runner. The deployed key is never
        # needed here, so it is never exposed to a public repo's CI.
        echo "${{ inputs.key-env }}=ci-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

    - name: Start the container
      shell: bash
      run: docker compose up -d --build

    - name: Wait for /health
      shell: bash
      run: |
        for _ in $(seq 1 ${{ inputs.health-timeout }}); do
          if curl -fsS "http://localhost:${{ inputs.port }}/health" >/dev/null 2>&1; then
            echo "healthy"
            exit 0
          fi
          sleep 1
        done
        echo "::error::/health never answered within ${{ inputs.health-timeout }}s"
        docker compose ps
        docker compose logs --tail=120
        exit 1

    - name: A public Host header is not rejected
      if: inputs.public-host != ''
      shell: bash
      run: |
        keyname='${{ inputs.key-env }}'
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          -X POST "http://localhost:${{ inputs.port }}${{ inputs.mcp-path }}" \
          -H "Host: ${{ inputs.public-host }}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -H "Authorization: Bearer ${!keyname}" \
          -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-host-probe","version":"1"}}}')
        if [ "$code" = "421" ]; then
          echo "::error::421 Invalid Host header for ${{ inputs.public-host }} -- DNS-rebinding protection is on again. Set TransportSecuritySettings(enable_dns_rebinding_protection=False)."
          docker compose logs --tail=60
          exit 1
        fi
        if [ "$code" != "200" ]; then
          echo "::error::expected 200 through the public Host header, got $code"
          docker compose logs --tail=60
          exit 1
        fi
        echo "  PASS: Host: ${{ inputs.public-host }} -> 200"

    - name: Run the smoke test against localhost
      shell: bash
      run: DOMAIN="http://localhost:${{ inputs.port }}" ./remote_smoke_test.sh

    - name: Container logs (on failure)
      if: failure()
      shell: bash
      run: docker compose logs --tail=200

    - name: Stop the container
      if: always()
      shell: bash
      run: docker compose down -v || true
