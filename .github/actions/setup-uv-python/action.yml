name: "Setup uv + Python"
description: >
  Install uv, pin Python 3.14, and `uv sync`. Shared across all azzindani
  MCP_* repos so the toolchain setup step is defined in exactly one place.
  Called via: uses: azzindani/MCP_Math/.github/actions/setup-uv-python@main

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  working-directory:
    description: Directory to run `uv sync` in (for uv-workspace monorepos)
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync
