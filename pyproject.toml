[project]
name = "math-mcp-server"
version = "0.1.2"
description = "Self-hosted MCP server for deterministic math computation"
requires-python = "==3.14.*"
dependencies = [
    "mcp>=1.0,<2.0",
    "sympy>=1.13,<2.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "pint>=0.24,<1.0",
    # sympy.parsing.latex requires this runtime at exactly 4.11.x (it checks
    # version().startswith("4.11")); widen only when sympy itself moves.
    "antlr4-python3-runtime>=4.11,<4.12",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0,<9.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
# Lint shared/, never rewrite it. These modules are meant to stay byte-identical
# with their siblings in the other repos, and the formatter forks them silently.
# MCP_File_System lints at line-length 100 and the rest at 120, which is how
# shared/oauth_bridge.py ended up 77 lines different from its twin by pure
# reflow, with nothing in the diff to say no logic had changed -- and how
# shared/counts.py forked on a single f-string within a day of being written.
# CI caught the second one: `ruff format --check` wanted to rewrite the file
# whose whole purpose is being the one copy.
exclude = ["shared/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
