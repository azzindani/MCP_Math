[project]
name = "math-mcp-server"
version = "0.1.0"
description = "Self-hosted MCP server for deterministic math computation"
requires-python = "==3.12.*"
dependencies = [
    "fastmcp>=2.0,<3.0",
    "sympy>=1.13,<2.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "pint>=0.24,<1.0",
    "latex2sympy2>=1.9,<2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0,<9.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
